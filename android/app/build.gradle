plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'  // Este es el plugin necesario para Firebase
}

android {
    namespace = "com.company.sabira"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.company.sabira"  // Reemplázalo por tu ID de paquete
        minSdk 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    // Aquí es donde agregamos las dependencias
    dependencies {
        //implementation 'com.google.firebase:firebase-auth:23.0.0'
        implementation 'com.google.firebase:firebase-messaging:23.0.0'
        implementation platform('com.google.firebase:firebase-bom:32.0.0')  // Esto maneja las versiones automáticamente
        implementation 'com.google.firebase:firebase-analytics'  // Firebase Core se ha reemplazado por Firebase Analytics
        // Asegúrate de agregar más dependencias si las necesitas:
        // implementation 'com.google.firebase:firebase-auth'
        // implementation 'com.google.firebase:firebase-database'
    }
}

// Aplica el plugin de Google Services al final
apply plugin: 'com.google.gms.google-services'  // Este es el paso crucial
